[graph]
all-features = true
no-default-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Internal workspace crates are never published, so skip license checks.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "MPL-2.0",
  # webpki-roots ships the Mozilla CA bundle under this license.
  "CDLA-Permissive-2.0",
]
exceptions = []

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Workspace path deps don't have a version, ignore them.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
# Duplicates pulled in by transitive deps with no upstream fix yet.
skip = [
  # axum, gcp_auth and sqlx are still on base64 0.22; imap-codec, reqwest and the gateway on 0.23.
  { crate = "base64" },
  # tungstenite (axum ws) hashes with sha1 on RustCrypto 0.10 while hmac, sha2
  # and chacha20poly1305 are on 0.11.
  { crate = "block-buffer" },
  { crate = "cpufeatures" },
  { crate = "crypto-common" },
  { crate = "digest" },
  # calcard 0.3 still depends on mail-parser 0.11 and mail-builder 1, next to
  # the 1.x and 2.x we use directly, and on chrono-tz with phf 0.12.
  { crate = "hashify" },
  { crate = "mail-builder" },
  { crate = "mail-parser" },
  { crate = "phf" },
  { crate = "phf_shared" },
  # governor (tower_governor) is on rand 0.9, dashmap and hashbrown 0.14; sqlx
  # and the rest are on rand 0.10 and hashbrown 0.16.
  { crate = "foldhash" },
  { crate = "getrandom" },
  { crate = "hashbrown" },
  { crate = "rand" },
  { crate = "rand_core" },
  { crate = "r-efi" },
  { crate = "syn" },
  { crate = "tower-http" },
  # apns-h2 (APNs, via push-delivery) signs with aws-lc-rs, which takes untrusted 0.7 where
  # ring takes 0.9, and its p12-keystore is on the previous RustCrypto releases.
  { crate = "cipher" },
  { crate = "const-oid" },
  { crate = "hmac" },
  { crate = "inout" },
  { crate = "sha2" },
  { crate = "synstructure" },
  { crate = "untrusted" },
  # uniffi's toml build dependency is a major behind everything else.
  { crate = "winnow" },
  # Windows-only: the crates that pull these differ on which release they take.
  { crate = "windows-core" },
  { crate = "windows-implement" },
  { crate = "windows-interface" },
  { crate = "windows-link" },
  { crate = "windows-result" },
  { crate = "windows-strings" },
  { crate = "windows-sys" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://git.ow-ops.eu/ow-ops/kit"]
