name: Desktop

# Forgejo's release workflow dispatches this with the commit and tag it builds,
# and the bundles join the Forgejo release that the Android job publishes.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to build
        required: true
        type: string
      tag:
        description: Forgejo release to attach the bundles to
        required: true
        type: string
      version:
        description: App version (1.2.3, or 1.2.3.<count> for a nightly)
        required: true
        type: string

permissions: {}

concurrency:
  group: desktop-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.100.0
  TAURI_CLI: '@tauri-apps/cli@2.12.6'
  FORGEJO_API: https://git.ow-ops.eu/api/v1/repos/ow-ops/mailbowox
  FORGEJO_PACKAGES: https://git.ow-ops.eu/api/packages/ow-ops

jobs:
  web:
    name: Build the web app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      EXPO_NO_TELEMETRY: 1
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      MAILBOWOX_CHANNEL: ${{ startsWith(inputs.tag, 'nightly-') && 'nightly' || 'stable' }}
    steps:
      # The push mirror from Forgejo can trail the dispatch.
      - name: Wait for the commit to reach GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          for _ in $(seq 40); do
            gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}" --silent && exit 0
            sleep 15
          done
          echo "::error::${SHA} never reached GitHub."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Setup Rust
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --target wasm32-unknown-unknown
          rustup default "${RUST_TOOLCHAIN}"

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm

      # The CLI has to be the version of the wasm-bindgen crate the core is built with.
      - name: Install wasm-bindgen
        run: |
          version="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          cargo install --locked wasm-bindgen-cli --version "${version}"

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ring compiles C for wasm32, which needs clang.
      - name: Build the core
        working-directory: packages/core-native
        run: CC_wasm32_unknown_unknown=clang pnpm ubrn:web

      - name: Export the web app
        working-directory: apps/app
        run: pnpm exec expo export -p web

      - name: Upload the web app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: apps/app/dist
          if-no-files-found: error
          retention-days: 1

  bundle:
    name: Bundle for ${{ matrix.name }}
    needs: web
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, runner: ubuntu-24.04 }
          - { name: Linux aarch64, runner: ubuntu-24.04-arm }
          - { name: Windows x86_64, runner: windows-latest }
          - { name: macOS aarch64, runner: macos-latest }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Download the web app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: apps/app/dist

      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential file libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf

      - name: Setup Rust
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # Bundlers want semver, so a nightly's build count becomes the prerelease.
      # Nightlies get their own identity to install alongside stable.
      # The web app is already built, so the bundle skips beforeBuildCommand.
      - name: Bundle
        working-directory: apps/desktop
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          version="$(cut -d. -f1-3 <<< "${VERSION}")"
          identity=''
          if [[ "${TAG}" == nightly-* ]]; then
            version="${version}-${VERSION##*.}"
            identity=',"productName":"mailbowox Nightly","mainBinaryName":"mailbowox-nightly","identifier":"eu.owops.mailbowox.nightly"'
          fi
          pnpm dlx "${TAURI_CLI}" build \
            --config "{\"version\":\"${version}\",\"build\":{\"beforeBuildCommand\":\"\"}${identity}}"

      - name: Upload the bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ runner.os }}-${{ runner.arch }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Attach to the Forgejo release
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Download the bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: bundles
          merge-multiple: true

      # Forgejo's release job creates the release before dispatching this.
      - name: Upload to the release
        env:
          TAG: ${{ inputs.tag }}
          TOKEN: ${{ secrets.FORGEJO_RELEASE_TOKEN }}
        run: |
          auth=(-H "Authorization: token ${TOKEN}")
          for _ in $(seq 240); do
            code="$(curl -sS "${auth[@]}" -o release.json -w '%{http_code}' "${FORGEJO_API}/releases/tags/${TAG}")"
            [ "${code}" = 404 ] || break
            sleep 15
          done
          if [ "${code}" != 200 ]; then
            echo "::error::Looking up release ${TAG} on Forgejo returned HTTP ${code}."
            exit 1
          fi
          id="$(jq -r .id release.json)"
          while IFS= read -r -d '' file; do
            name="$(basename "${file}")"
            curl -fsS --retry 3 "${auth[@]}" -o /dev/null \
              -F "attachment=@${file}" \
              "${FORGEJO_API}/releases/${id}/assets?name=$(jq -rn --arg name "${name}" '$name | @uri')"
            echo "Uploaded ${name}"
          done < <(find bundles -type f -print0)

      # Forgejo's .repo file sets gpgcheck, so the rpm is signed on upload.
      - name: Publish to the deb and rpm repos
        env:
          TAG: ${{ inputs.tag }}
          PACKAGES_USER: ${{ secrets.PACKAGES_USER }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          channel=stable
          [[ "${TAG}" != nightly-* ]] || channel=nightly
          upload() {
            code="$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' \
              --user "${PACKAGES_USER}:${PACKAGES_TOKEN}" --upload-file "$1" "$2")"
            # 409 means this exact version is already published.
            case "${code}" in
              201 | 409) echo "Published $(basename "$1") (${code})" ;;
              *) echo "::error::Publishing $(basename "$1") failed with HTTP ${code}."; exit 1 ;;
            esac
          }
          for deb in bundles/deb/*.deb; do
            upload "${deb}" "${FORGEJO_PACKAGES}/debian/pool/${channel}/main/upload"
          done
          for rpm in bundles/rpm/*.rpm; do
            upload "${rpm}" "${FORGEJO_PACKAGES}/rpm/${channel}/upload?sign=true"
          done
