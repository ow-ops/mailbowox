---
name: Checks

on:
  pull_request:
  workflow_call:
    inputs:
      skip-web:
        type: boolean
        default: false

concurrency:
  # Named apart from the calling workflow's group, which a called run would otherwise share.
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: 0
  SCCACHE_BUCKET: ow-oops-sccache
  SCCACHE_S3_KEY_PREFIX: mailbowox
  SCCACHE_ENDPOINT: https://s3.gra.io.cloud.ovh.net
  SCCACHE_REGION: gra
  SCCACHE_S3_USE_SSL: 'true'

jobs:
  fmt:
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: docker
    env:
      RUSTC_WRAPPER: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: https://git.ow-ops.eu/ow-ops/kit/.forgejo/actions/rust@main
        with:
          toolchain: 1.100.0
          components: clippy
          cache-key: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: docker
    env:
      RUSTC_WRAPPER: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      COMPOSE_PROJECT_NAME: mailbox-${{ github.run_id }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: https://git.ow-ops.eu/ow-ops/kit/.forgejo/actions/rust@main
        with:
          toolchain: 1.100.0
          cache-key: test
      - uses: https://github.com/taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest@0.9.152
      # The core's and the gateway's IMAP tests talk to this Stalwart server. The job shares its
      # network with the Docker daemon, so the published ports are on 127.0.0.1.
      - name: Start the test mailbox
        run: dev/mailbox/setup.sh
      - run: cargo nextest run --workspace --all-features --no-fail-fast
      - name: Remove the test mailbox
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}/dev/mailbox
        run: docker compose down -v

  deny:
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - uses: https://github.com/taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.22.0
      - run: cargo deny --all-features check

  machete:
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: https://github.com/taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-machete@0.10.1
      - run: cargo-machete

  typos:
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: https://github.com/taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: typos-cli@1.52.2
      - run: typos

  taplo:
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: https://github.com/taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: taplo-cli@0.10.0
      - run: taplo fmt --check

  app:
    runs-on: docker
    env:
      RUSTC_WRAPPER: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}/apps/app
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: https://git.ow-ops.eu/ow-ops/kit/.forgejo/actions/rust@main
        with:
          toolchain: 1.100.0
          cache-key: bindings
      - name: Setup
        uses: https://git.ow-ops.eu/ow-ops/kit/.forgejo/actions/setup@main
      # The TypeScript bindings are generated from the core's compiled library.
      - name: Generate the core bindings
        working-directory: ${{ github.workspace }}
        run: |-
          cargo build -p mailbowox-core
          cd packages/core-native
          pnpm exec ubrn generate all --config ubrn.config.yaml ../../target/debug/libmailbowox_core.a
      - name: Generate Expo types
        run: pnpm exec expo customize tsconfig.json
      - run: pnpm exec tsc --noEmit
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm dlx knip@6.46.1
      - run: pnpm audit --prod --audit-level high

  web:
    # The web image build already compiles WASM and exports the site.
    if: inputs.skip-web != true
    runs-on: docker
    env:
      RUSTC_WRAPPER: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: https://git.ow-ops.eu/ow-ops/kit/.forgejo/actions/rust@main
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
          cache-key: wasm
      # ring compiles C for wasm32, which needs clang.
      - name: Install clang
        run: |-
          sudo_cmd=()
          [ "$(id -u)" -eq 0 ] || sudo_cmd=(sudo)
          "${sudo_cmd[@]}" apt-get update
          "${sudo_cmd[@]}" apt-get install --no-install-recommends -y clang
      # The CLI has to be the version of the wasm-bindgen crate the core is built with.
      - name: Read the wasm-bindgen version
        id: bindgen
        run: |-
          version="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - uses: https://github.com/taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: wasm-bindgen-cli@${{ steps.bindgen.outputs.version }}
      - name: Setup
        uses: https://git.ow-ops.eu/ow-ops/kit/.forgejo/actions/setup@main
      - name: Build the core for the web
        working-directory: ${{ github.workspace }}/packages/core-native
        run: pnpm ubrn:web
        env:
          CC_wasm32_unknown_unknown: clang
      - name: Bundle the site
        working-directory: ${{ github.workspace }}/apps/app
        run: pnpm exec expo export -p web
