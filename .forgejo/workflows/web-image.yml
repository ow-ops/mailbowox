---
name: Web image

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        required: true

env:
  IMAGE: git.ow-ops.eu/ow-ops/mailbowox-web

jobs:
  build:
    name: Build and push web image
    if: inputs.publish
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the image build
        id: image
        uses: https://git.ow-ops.eu/ow-ops/kit/.forgejo/actions/image-setup@main
        with:
          token: ${{ secrets.FORGE_TOKEN }}

      - name: Build and push
        uses: https://github.com/docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
        with:
          context: .
          file: apps/app/Dockerfile
          build-args: |
            EXPO_PUBLIC_SENTRY_DSN=${{ vars.SENTRY_DSN }}
            EXPO_PUBLIC_RELAY_URL=https://mailbowox-gateway.erwanleboucher.dev
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.image.outputs.sha }}
            ${{ env.IMAGE }}:${{ steps.image.outputs.release }}
            ${{ env.IMAGE }}:main
          cache-from: type=s3,region=gra,bucket=ow-oops-sccache,endpoint_url=https://s3.gra.io.cloud.ovh.net,prefix=buildkit/mailbowox/,name=web
          cache-to: type=s3,region=gra,bucket=ow-oops-sccache,endpoint_url=https://s3.gra.io.cloud.ovh.net,prefix=buildkit/mailbowox/,name=web,mode=max,ignore-error=true
