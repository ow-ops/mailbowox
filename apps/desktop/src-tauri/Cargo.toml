[package]
name = "mailbowox-desktop"
version = "0.1.0"
edition = "2024"
publish = false

# Not a member of the root workspace yet: its checks run on Linux runners without the WebKit libraries.
[workspace]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
backon = { version = "1.6.0", default-features = false, features = ["std"] }
mailbowox-core = { path = "../../../crates/core" }
mailbowox-gateway = { path = "../../../crates/gateway" }
mailbowox-sql = { path = "../../../crates/sql", features = ["engine"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["net", "time"] }
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync"] }

[features]
# Serves the bundled site instead of the dev server, for a cargo build without the Tauri CLI.
custom-protocol = ["tauri/custom-protocol"]

# The root workspace's lints; this crate is outside it.
[lints.rust]
warnings = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
elided_lifetimes_in_paths = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
single_use_lifetimes = "deny"
meta_variable_misuse = "deny"
macro_use_extern_crate = "deny"
unused_macro_rules = "deny"
non_ascii_idents = "deny"
missing_abi = "deny"
ffi_unwind_calls = "deny"
explicit_outlives_requirements = "deny"
keyword_idents_2024 = "deny"
deprecated_in_future = "deny"

[lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
pedantic = { level = "deny", priority = -1 }
# Selected stable nursery lints; keep the full nursery group disabled.
missing_const_for_fn = "deny"
option_if_let_else = "deny"
significant_drop_in_scrutinee = "deny"
needless_collect = "deny"
redundant_clone = "deny"
