[package]
name = "mailbowox-desktop"
version = "0.1.0"
edition = "2024"
publish = false

# Not a member of the root workspace yet: its checks run on Linux runners without the WebKit libraries.
[workspace]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
hex = "0.4.3"
mailbowox-gateway = { path = "../../../crates/gateway" }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-opener = "2.7.3"
tokio = { version = "1.54.1", features = ["net"] }
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Serves the bundled site instead of the dev server, for a cargo build without the Tauri CLI.
custom-protocol = ["tauri/custom-protocol"]
